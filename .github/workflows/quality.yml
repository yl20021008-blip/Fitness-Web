name: FitPersona checks

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: JavaScript quality tests
        run: node --test tests/*.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Python syntax checks
        run: python -m compileall -q app.py admin_dashboard.py
